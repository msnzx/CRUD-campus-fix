name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when the branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Frontend regression tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # The Supabase client throws at import time when these are absent, so
        # the build needs values present. These are placeholders: CI never
        # reaches a real project, and a publishable key grants nothing anyway.
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock.txt

      - run: pip install -r requirements.txt -r requirements.lock.txt

      - name: Compile all modules
        run: python -m compileall -q app

      - name: Routing regression tests
        run: python -m unittest discover -s tests -v

      - name: Batch 2 offline data and evaluation protocol
        working-directory: .
        run: python -m unittest discover -s experiments/batch2/tests -v

      - name: Batch 3 vision offline regressions
        run: python -m unittest discover -s tests -p test_vision.py -v

      - name: Batch 4 retrieval offline regressions
        run: python -m unittest discover -s tests -p test_knowledge.py -v

      - name: Locked dependency integrity
        working-directory: .
        run: |
          python -m pip check
          python -m experiments.batch6.dependencies

      - name: Batch 5 active learning and distillation experiment protocol
        working-directory: .
        run: python -m unittest discover -s experiments/batch5/tests -v

      - name: Batch 6 offline observability security and regression tests
        working-directory: .
        run: python -m unittest discover -s experiments/batch6/tests -v

      - name: Frozen benchmark integrity and offline metrics
        run: |
          python ../evaluation/reproduce_metrics.py --check
          python -m unittest discover -s ../evaluation -v

      - name: Smoke test the API
        # No real credentials. The service starts and reports its own degraded
        # state rather than crashing — that behaviour is the thing being tested.
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)

          r = client.get('/api/health')
          assert r.status_code == 200, r.text
          body = r.json()
          assert body['status'] == 'ok', body
          # Without a service-role key the API must degrade, not pretend.
          assert body['admin_enabled'] is False, body
          assert body['ai_enabled'] is False, body

          # Authorization must be refused before anything else happens.
          assert client.post('/api/tickets/1/classify').status_code == 401
          assert client.post(
              '/api/tickets/1/classify',
              headers={'Authorization': 'Bearer not-a-real-token'},
          ).status_code == 401

          print('backend smoke test passed')
          PY

  database:
    name: Throwaway PostgreSQL regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runtime and database test tools
        run: |
          pip install -r backend/requirements.txt -r backend/requirements.lock.txt
          pip install -r supabase/tests/local/requirements.txt -c backend/requirements.lock.txt
          pip check
      - name: Require native database tools and run all database regressions
        run: |
          python -c "import pgserver, psycopg"
          python - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover('supabase/tests/local')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful() or bool(result.skipped))
          PY

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a .env file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked. Remove it and rotate the credentials."
            exit 1
          fi
          echo "No tracked .env files."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan tracked files for private keys and encoded service-role credentials
        run: python -m experiments.batch6.security_scan
