name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when the branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # The Supabase client throws at import time when these are absent, so
        # the build needs values present. These are placeholders: CI never
        # reaches a real project, and a publishable key grants nothing anyway.
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend — import & smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Compile all modules
        run: python -m compileall -q app

      - name: Smoke test the API
        # No real credentials. The service starts and reports its own degraded
        # state rather than crashing — that behaviour is the thing being tested.
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          client = TestClient(app)

          r = client.get('/api/health')
          assert r.status_code == 200, r.text
          body = r.json()
          assert body['status'] == 'ok', body
          # Without a service-role key the API must degrade, not pretend.
          assert body['admin_enabled'] is False, body
          assert body['ai_enabled'] is False, body

          # Authorization must be refused before anything else happens.
          assert client.post('/api/tickets/1/classify').status_code == 401
          assert client.post(
              '/api/tickets/1/classify',
              headers={'Authorization': 'Bearer not-a-real-token'},
          ).status_code == 401

          print('backend smoke test passed')
          PY

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a .env file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::A .env file is tracked. Remove it and rotate the credentials."
            exit 1
          fi
          echo "No tracked .env files."

      - name: Fail on a service_role key
        run: |
          # A service_role JWT carries that literal claim in its payload and
          # bypasses RLS entirely. It must never reach the repository.
          if git grep -I -n -E '"role"\s*:\s*"service_role"' -- . ':!.github'; then
            echo "::error::A service_role key appears to be committed. Rotate it immediately."
            exit 1
          fi
          echo "No service_role key found."
