[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
# The publishable key is public by design (RLS protects the data) and is
# compiled into the Vite bundle, so exclude it from the secrets scan.
SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_URL,VITE_API_URL"

# Single-page app: serve index.html for every route so React Router handles it
# (deep links, refreshes, and Supabase auth/password-reset redirects).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
